name = "liga-amateur"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "liga-amateur"
database_id = "8f8b91c7-7473-4d50-88fd-d996dbd2583e"

[assets]
directory = "./public"
binding = "ASSETS"

# Imágenes del portal (Fase 18.3). El bucket es PRIVADO a propósito: las
# imágenes se sirven siempre desde el Worker en /i/{id}, que primero verifica
# que el recurso padre esté publicado. Así un borrador no es accesible ni por
# URL directa, y no hace falta exponer el bucket en Internet.
[[r2_buckets]]
binding = "R2_PUBLIC_BUCKET"
bucket_name = "zona-liga-imagenes"

[vars]
# Cuánto se guarda en caché cada página pública (ver src/lib/cache.ts).
# Un minuto alcanza: las posiciones y el fixture cambian cuando se carga un
# resultado, no antes, y con esto el consumo diario de filas leídas de D1 baja
# de ~380 a miles de visitas por día. Con "0" la caché queda apagada.
CACHE_PUBLICA_TTL = "60"

# El CHANGELOG.md se importa como texto desde src/changelog.ts (fuente única).
# Sin esta regla, esbuild no sabría cómo cargar un .md.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = false

[observability]
enabled = true
